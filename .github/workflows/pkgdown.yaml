# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Deploying needs GitHub Pages switched on for the repository, serving from the
# gh-pages branch. Until that is done the build still runs and simply has
# nowhere to publish to.
#
# The site is built and published for releases only. main carries the
# development version, so publishing from every push would leave the
# documented package permanently ahead of the one anyone can install, and a
# reader arriving at the site would find arguments that are not in the
# release they have. workflow_dispatch stays as the manual escape hatch, for
# republishing a site whose deployment failed rather than for previewing
# unreleased work.
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # One deployment at a time. The pull request case the upstream template
    # guards against cannot arise here, since a pull request no longer
    # triggers this workflow.
    concurrency:
      group: pkgdown
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The vignettes are not precompiled, so building the articles runs the
      # samplers. That is cheap here -- the longest chain in them is 20,000
      # draws on 500 observations -- and it keeps the published output honest.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
